{% extends "base.html" %}
<!--This is basically saying that we're adding onto base.html. When you change content on base.html, it also ends up in index.html.-->

{% block content %}
<h1>Hi, {{ user.username }}!</h1>
<section class="flex-intro">
  <div class="items">
    {% for item in passedDictionary %}

    <p>
      The key is: <span class="dict_key">{{item}}</span> and the value is:
      <span class="dict_value">{{passedDictionary[item]}}</span>
    </p>

    {% endfor %}
  </div>
  <div class="img_div">
    <img src="{{imgPath}}" />
  </div>
</section>
{% endblock %}

<!-- Base is basically the template that is used by everyone. index.html is a copy of it. The above code is basically the info that "block content" will contain-->
